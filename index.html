<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f06a3b" />
    <meta name="description" content="مشاوير، توصيل أسرع من محلات قريتك إلى بابك." />
    <base href="./" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="logo-official-transparent.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <title>مشاوير | توصيل القرية</title>
  <style>
    body.intro-lock { overflow: hidden; }
    body.intro-lock #app { visibility: hidden; }
    .intro-screen { display: grid; position: fixed; z-index: 200; inset: 0; overflow: hidden; place-items: center; background: #151515; opacity: 1; transition: opacity .35s ease; }
    .intro-screen.is-hidden { opacity: 0; pointer-events: none; }
    .intro-video { width: 100%; height: 100%; object-fit: cover; background: #151515; }
    .intro-overlay { display: flex; position: absolute; inset: 0; align-items: center; justify-content: center; flex-direction: column; padding: 24px 22px; background: linear-gradient(180deg, rgba(0,0,0,.14), rgba(0,0,0,.08) 48%, rgba(0,0,0,.56)); }
    .intro-logo { width: min(62vw, 300px); height: min(62vw, 300px); object-fit: contain; filter: drop-shadow(0 18px 30px rgba(0,0,0,.42)); }
    .intro-skip { position: absolute; right: 18px; bottom: 18px; min-height: 38px; border: 1px solid rgba(255,255,255,.45); border-radius: 999px; padding: 7px 17px; color: #fff; background: rgba(21,21,21,.45); font-size: 12px; font-weight: 800; backdrop-filter: blur(8px); }
    .intro-skip:hover { border-color: #f26a35; background: #f26a35; }
  </style>
  </head>
  <body class="intro-lock">
    <section id="intro-screen" class="intro-screen" aria-label="مقدمة مشاوير">
      <video id="intro-video" class="intro-video" autoplay muted playsinline preload="auto" poster="logo-official-transparent.png"><source src="intro.mp4" type="video/mp4" /></video>
      <div class="intro-overlay"><img class="intro-logo" src="logo-official-transparent.png" alt="مشاوير" /><button id="skip-intro" class="intro-skip" type="button">تخطي</button></div>
    </section>
    <div id="app" aria-hidden="true"></div>
    <div id="toast" class="toast" aria-live="polite"></div>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
    <script src="app.js"></script>
<script>
    (() => {
      const screen = document.getElementById('intro-screen');
      const video = document.getElementById('intro-video');
      const app = document.getElementById('app');
      let timer;
      const finish = () => {
        if (!screen || screen.classList.contains('is-hidden')) return;
        clearTimeout(timer);
        try { sessionStorage.setItem('mashwer_intro_seen', '1'); } catch {}
        document.body.classList.remove('intro-lock');
        app?.setAttribute('aria-hidden', 'false');
        screen.classList.add('is-hidden');
        setTimeout(() => screen.remove(), 420);
      };
      document.getElementById('skip-intro')?.addEventListener('click', finish);
      let seen = false;
      try { seen = sessionStorage.getItem('mashwer_intro_seen') === '1'; } catch {}
      if (seen) finish();
      else {
        timer = setTimeout(finish, 9000);
        video?.addEventListener('ended', finish, { once: true });
        video?.addEventListener('error', () => { timer = setTimeout(finish, 1800); }, { once: true });
        video?.play?.().catch(() => { timer = setTimeout(finish, 1800); });
      }
    })();
  </script>
  </body>
</html>
