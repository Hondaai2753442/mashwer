name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prepare Capacitor web directory
        run: |
          rm capacitor.config.ts
          rm -rf www
          mkdir -p www
          cp index.html app.js config.js styles.css manifest.webmanifest icon.svg 317992.png logo-official-transparent.png intro.mp4 navigation.js sw.js www/
          cp -R routes www/
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.mashwer.delivery",
            "appName": "مشاوير",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          EOF
      - name: Verify web assets
        run: |
          test -f www/intro.mp4
          test -f www/logo-official-transparent.png
          test -f www/navigation.js
          test -f www/routes/customer-orders.js
          test -f www/routes/driver-orders.js
          test -f www/routes/driver-earnings.js
          test -f www/routes/driver-notifications.js
      - name: Create Android project
        run: npx cap add android
      - name: Sync web app
        run: npx cap sync android
      - name: Set release version
        run: |
          sed -i 's/versionCode 1/versionCode 5/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.5"/' android/app/build.gradle
      - name: Build APK and AAB
        working-directory: android
        run: ./gradlew assembleDebug bundleRelease
      - name: Upload Android files
        uses: actions/upload-artifact@v4
        with:
          name: mashwer-android-final
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab

