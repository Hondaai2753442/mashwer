name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Use JSON Capacitor config
        run: |
          rm capacitor.config.ts
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.mashwer.delivery",
            "appName": "مشاوير",
            "webDir": ".",
            "server": { "androidScheme": "https" }
          }
          EOF
      - name: Create Android project
        run: npx cap add android
      - name: Sync web app
        run: npx cap sync android
      - name: Set release version
        run: |
          sed -i 's/versionCode 1/versionCode 5/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.5"/' android/app/build.gradle
      - name: Build APK and AAB
        working-directory: android
        run: ./gradlew assembleDebug bundleRelease
      - name: Upload Android files
        uses: actions/upload-artifact@v4
        with:
          name: mashwer-android-v5
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
